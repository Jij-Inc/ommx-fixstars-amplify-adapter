name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Dependencies
        run: |
          uv sync --all-extras
          uv pip install pytest-github-actions-annotate-failures

      - name: Type check
        if: always()
        run: |
          uv run pyright

      - name: Lint
        if: always()
        run: |
          uv run ruff check

      - name: Check format
        if: always()
        run: |
          uv run ruff format --check

      - name: Run Tests
        if: always()
        run: |
          uv run pytest --doctest-modules -vv

      - name: Test minimum runtime dependencies
        if: matrix.python-version == '3.11'
        run: |
          uv pip compile pyproject.toml --resolution lowest-direct -o "$RUNNER_TEMP/minimum.txt"
          uv run --isolated --no-project --with-requirements "$RUNNER_TEMP/minimum.txt" --with pytest python -m pytest --doctest-modules -v
