[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ommx_fixstars_amplify_adapter"
dynamic = ["version"]
description = "An adapter for the Fixstars Amplify from/to OMMX."
authors = [
    { name="Jij Inc.", email="info@j-ij.com" },
]

readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    "ommx >= 3.0.0b3, < 4.0.0",
    "amplify >= 1.2.0, < 2.0.0", 
]

[project.optional-dependencies]
dev = [
    "pyright",
    "pytest",
    "ruff",
    "sphinx",
    "sphinx-autoapi",
    "sphinx_fontawesome",
    "sphinx_rtd_theme",
]

[tool.setuptools_scm]
version_file = "ommx_fixstars_amplify_adapter/_version.py"

# TODO: Temporary local source override until OMMX 3.0.0b3 is published.
# Remove this section and regenerate uv.lock against PyPI after the release.
[tool.uv.sources]
ommx = { path = "../../ommx/python/ommx", editable = true }
